<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>try { var t = localStorage.getItem('forge:theme'); document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch {}</script>
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A guided, local-first gym workout companion." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/forge.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/forge.svg" />
    <title>Forge — Workout Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
